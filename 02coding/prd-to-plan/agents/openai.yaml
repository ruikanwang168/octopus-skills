interface:
  display_name: "PRD 到 AI 执行计划"
  short_description: "确认需求技术沿用与新增框架并生成可执行 AI 计划"
  default_prompt: "使用 $prd-to-plan 先确认 PRD、原型、前后端代码、现有全量数据库脚本及辅助资料范围；阶段 3先生成以单个用户故事为阅读主线的 AI执行清单确认.md，在每个故事内集中展示页面、按钮、自动行为和业务接口能力，稳定 ID 追溯信息降级到附录，再由确认 MD 派生 AI执行清单.json；不提前设计接口地址或前端路由，阶段 4再检索现有代码并生成可直接开发的执行包。"
